apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-dev-test
  namespace: bot-dev-test
  labels:
    app: bot-dev-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-dev-test
  template:
    metadata:
      labels:
        app: bot-dev-test
    spec:
      containers:
        - name: web
          image: ghcr.io/script-repo/bot-dev-test:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
